<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">

    <!-- Greeting -->
    <section class="hero" aria-label="Greeting">
      <div class="hero-top">
        <p id="greeting" class="greeting">Hello</p>
        <button id="theme-toggle" class="btn btn-ghost" type="button">Dark mode</button>
      </div>
      <p id="clock" class="clock" aria-live="off">00:00:00</p>
      <p id="date" class="date"></p>
      <label class="name-field">
        <span>Your name</span>
        <input id="name-input" type="text" maxlength="24" placeholder="Type your name" autocomplete="given-name">
      </label>
    </section>

    <!-- Focus Timer -->
    <section class="panel" aria-labelledby="timer-title">
      <h2 id="timer-title">Focus timer</h2>
      <p id="timer" class="timer" role="timer">25:00</p>
      <div class="row">
        <button id="timer-start" class="btn btn-primary" type="button">Start</button>
        <button id="timer-stop" class="btn" type="button">Stop</button>
        <button id="timer-reset" class="btn" type="button">Reset</button>
      </div>
      <label class="inline-field">
        <span>Minutes</span>
        <input id="timer-minutes" type="number" min="1" max="180" value="25">
      </label>
      <p id="timer-status" class="status" aria-live="polite"></p>
    </section>

    <!-- To-Do List -->
    <section class="panel" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Tasks</h2>
      <form id="task-form" class="row">
        <input id="task-input" type="text" maxlength="120" placeholder="Add a new task" aria-label="New task" required>
        <button class="btn btn-primary" type="submit">Add task</button>
      </form>
      <p id="task-status" class="status" aria-live="polite"></p>
      <ul id="task-list" class="task-list"></ul>
    </section>

    <!-- Quick Links -->
    <section class="panel wide" aria-labelledby="links-title">
      <h2 id="links-title">Quick links</h2>
      <form id="link-form" class="row">
        <input id="link-name" type="text" maxlength="20" placeholder="Name" aria-label="Link name" required>
        <input id="link-url" type="text" placeholder="example.com" aria-label="Link URL" required>
        <button class="btn btn-primary" type="submit">Add link</button>
      </form>
      <p id="link-status" class="status" aria-live="polite"></p>
      <ul id="link-list" class="link-list"></ul>
    </section>

  </main>
</body>
<script src="js/app.js"></script>
</html>
